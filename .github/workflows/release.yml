# Release: push a tag "<theme>@<version>" (e.g. bond@1.1.0) to build that ONE
# theme and attach its install ZIP to a DRAFT GitHub release with a build
# provenance attestation. A maintainer reviews and publishes the draft.
# Nothing is ever deployed to a DNN server from CI.
name: Release

on:
  push:
    tags: ['*@*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers on this environment in GitHub settings to
    # require a human approval before the draft is created.
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # OIDC for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Parse and verify tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          theme="${TAG%@*}"; version="${TAG#*@}"
          [[ "$theme" =~ ^[a-z][a-z0-9-]{1,30}$ && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like <theme>@<x.y.z>"; exit 1; }
          [[ -f "themes/$theme/theme.json" ]] || { echo "::error::Unknown theme $theme"; exit 1; }
          pkg=$(node -p "require('./themes/$theme/package.json').version")
          [[ "$pkg" == "$version" ]] || { echo "::error::Tag version $version != themes/$theme/package.json version $pkg"; exit 1; }
          echo "theme=$theme" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify
        env:
          THEME: ${{ steps.tag.outputs.theme }}
        run: |
          pnpm run check
          pnpm run lint
          node packages/build/bin/bond.mjs build "$THEME" --mode production
          node packages/build/bin/bond.mjs validate "$THEME"
          pnpm test

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/${{ steps.tag.outputs.theme }}/packages/*.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          THEME: ${{ steps.tag.outputs.theme }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "$TAG" \
            --notes-file "themes/$THEME/package/ReleaseNotes.txt" \
            publish/$THEME/packages/*.zip \
            publish/$THEME/packages/SHA256SUMS \
            publish/$THEME/reports/build-manifest.json
