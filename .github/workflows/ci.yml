# CI: validates every PR and push to main. Never deploys anything.
# Actions are pinned to full commit SHAs (tags are mutable); Dependabot bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git history: build traceability, migration parity tests, `bond affected`
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile, lifecycle scripts blocked by pnpm-workspace.yaml)
        run: pnpm install --frozen-lockfile
      - name: Architecture checks
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Build all themes (production)
        run: pnpm run build:all
      - name: Re-verify published output
        run: pnpm run validate
      - name: Integration tests
        run: pnpm test
      - name: Record package checksums
        shell: bash
        run: cat publish/*/packages/SHA256SUMS | sort | tee "checksums-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dnn-packages-${{ runner.os }}
          path: |
            publish/*/packages/
            publish/*/reports/
            checksums-*.txt
          retention-days: 14
          if-no-files-found: error

  reproducible:
    name: Same packages on Linux and Windows
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dnn-packages-*
          merge-multiple: false
      - name: Compare checksums
        run: |
          diff -u dnn-packages-Linux/checksums-Linux.txt dnn-packages-Windows/checksums-Windows.txt
          echo "Install ZIPs are byte-identical across operating systems." >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: Visual regression & CSS isolation
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Impact analysis
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }} # via env, never interpolated into the script
        run: |
          echo "### Themes affected by this PR" >> "$GITHUB_STEP_SUMMARY"
          node packages/build/bin/bond.mjs affected --base "origin/$BASE_REF" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright (screenshots, isolation guarantees, behaviour, migration parity)
        run: pnpm run test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    name: Dependency audit & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (high and above fail the build)
        run: pnpm audit --audit-level high
      - name: Secret scan of the full history (gitleaks CLI, MIT)
        run: |
          # v8.30.1, pinned by digest
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1
