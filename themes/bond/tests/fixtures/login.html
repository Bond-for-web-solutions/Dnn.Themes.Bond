<main class="bond-main">
  <div id="dnn_ContentPane" class="bond-content">
    <div class="DnnModule DnnModule-Authentication DnnModule-412"><a name="412"></a>
      <div id="dnn_ctr412_ContentPane"><div id="dnn_ctr412_ModuleContent" class="DNNModuleContent ModAuthenticationC">
        <div class="dnnForm dnnLogin dnnClear"><div id="dnn_ctr412_Login_pnlLogin"><div class="loginContent">
          <div id="dnn_ctr412_Login_pnlLoginContainer" class="LoginPanel" style="display:block;">
            <div id="dnn_ctr412_Login_DNN">
              <div class="dnnForm dnnLoginService dnnClear">
                <div class="dnnFormItem"><div class="dnnLabel"><label id="dnn_ctr412_Login_Login_DNN_plUsername" for="dnn_ctr412_Login_Login_DNN_txtUsername" class="dnnFormLabel">Username:</label></div>
                  <input name="dnn$ctr412$Login$Login_DNN$txtUsername" type="text" id="dnn_ctr412_Login_Login_DNN_txtUsername"></div>
                <div class="dnnFormItem"><div class="dnnLabel"><label id="dnn_ctr412_Login_Login_DNN_plPassword" for="dnn_ctr412_Login_Login_DNN_txtPassword" class="dnnFormLabel">Password:</label></div>
                  <input name="dnn$ctr412$Login$Login_DNN$txtPassword" type="password" id="dnn_ctr412_Login_Login_DNN_txtPassword"></div>
                <div class="dnnFormItem"><span id="dnn_ctr412_Login_Login_DNN_lblLoginRememberMe" class="dnnFormLabel"></span>
                  <span class="dnnLoginRememberMe"><input id="dnn_ctr412_Login_Login_DNN_chkCookie" type="checkbox" name="dnn$ctr412$Login$Login_DNN$chkCookie"><label for="dnn_ctr412_Login_Login_DNN_chkCookie">Remember Login</label></span></div>
                <div class="dnnFormItem"><label id="dnn_ctr412_Login_Login_DNN_lblLogin" for="dnn_ctr412_Login_Login_DNN_cmdLogin" class="dnnFormLabel"></label>
                  <a id="dnn_ctr412_Login_Login_DNN_cmdLogin" title="Login" class="dnnPrimaryAction" href="#postback-login">Login</a>
                  <a id="dnn_ctr412_Login_Login_DNN_cancelLink" class="dnnSecondaryAction" href="http://127.0.0.1/">Cancel</a></div>
                <div class="dnnFormItem"><span class="dnnFormLabel">&nbsp;</span><div class="dnnLoginActions"><ul class="dnnActions dnnClear">
                  <li id="dnn_ctr412_Login_Login_DNN_liPassword"><a id="dnn_ctr412_Login_Login_DNN_passwordLink" class="dnnSecondaryAction" href="http://127.0.0.1/Login?ctl=SendPassword">Reset Password</a></li>
                </ul></div></div>
              </div>
            </div>
          </div>
        </div></div></div>
